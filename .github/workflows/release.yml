name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run signed/notarized build without publishing release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  mac-release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: mac-secrets
        shell: bash
        run: |
          missing=0
          for key in CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        run: npm ci

      - name: Validate
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Release Preflight
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        run: npm run release:preflight

      - name: Build Signed Dry Run
        if: ${{ steps.mac-secrets.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:mac:dry-run

      - name: Build and Publish Draft Release
        if: ${{ steps.mac-secrets.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: npm run dist:mac

      - name: Skip mac release
        if: ${{ steps.mac-secrets.outputs.available != 'true' }}
        run: echo "Skipping mac release because signing secrets are not configured."

  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV
          echo "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Build Windows Installer Dry Run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:win:dry-run

      - name: Build Windows Installer
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run dist:win:dry-run

      - name: Publish Draft Release (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
