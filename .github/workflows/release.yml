name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run signed/notarized build without publishing release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  mac-release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAIN_VITE_HYDRA_FIREBASE_API_KEY: ${{ vars.HYDRA_FIREBASE_API_KEY || secrets.HYDRA_FIREBASE_API_KEY }}
      MAIN_VITE_HYDRA_FIREBASE_AUTH_DOMAIN: ${{ vars.HYDRA_FIREBASE_AUTH_DOMAIN || secrets.HYDRA_FIREBASE_AUTH_DOMAIN }}
      MAIN_VITE_HYDRA_FIREBASE_PROJECT_ID: ${{ vars.HYDRA_FIREBASE_PROJECT_ID || secrets.HYDRA_FIREBASE_PROJECT_ID }}
      MAIN_VITE_HYDRA_FIREBASE_STORAGE_BUCKET: ${{ vars.HYDRA_FIREBASE_STORAGE_BUCKET || secrets.HYDRA_FIREBASE_STORAGE_BUCKET }}
      MAIN_VITE_HYDRA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.HYDRA_FIREBASE_MESSAGING_SENDER_ID || secrets.HYDRA_FIREBASE_MESSAGING_SENDER_ID }}
      MAIN_VITE_HYDRA_FIREBASE_APP_ID: ${{ vars.HYDRA_FIREBASE_APP_ID || secrets.HYDRA_FIREBASE_APP_ID }}
      MAIN_VITE_HYDRA_FIREBASE_MEASUREMENT_ID: ${{ vars.HYDRA_FIREBASE_MEASUREMENT_ID || secrets.HYDRA_FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: bash
        run: |
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Check Firebase release env
        shell: bash
        run: |
          missing=0
          for key in \
            MAIN_VITE_HYDRA_FIREBASE_API_KEY \
            MAIN_VITE_HYDRA_FIREBASE_AUTH_DOMAIN \
            MAIN_VITE_HYDRA_FIREBASE_PROJECT_ID \
            MAIN_VITE_HYDRA_FIREBASE_STORAGE_BUCKET \
            MAIN_VITE_HYDRA_FIREBASE_MESSAGING_SENDER_ID \
            MAIN_VITE_HYDRA_FIREBASE_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Set repository vars/secrets HYDRA_FIREBASE_* before building a release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Build Mac Artifacts (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:mac:dry-run

      - name: Build Mac Artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run dist:mac:dry-run

      - name: Resolve release tag (Mac)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        id: release-tag
        shell: bash
        run: |
          tag=""
          tag_from_sha=$(git tag --points-at "$GITHUB_SHA" | head -n1)
          if [ -n "$tag_from_sha" ]; then
            tag="$tag_from_sha"
          fi
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "Unable to resolve release tag. GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Ensure published release with generated notes (Mac)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: bash
        run: |
          tag="${{ steps.release-tag.outputs.tag }}"
          npm run release:notes -- upsert "$tag" --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json id,isDraft,isPrerelease,url

      - name: Upload release assets (Mac)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: bash
        run: |
          tag="${{ steps.release-tag.outputs.tag }}"
          shopt -s nullglob
          assets=(dist/*.dmg dist/*.blockmap dist/latest-mac*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Mac artifacts found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload workflow artifact (Mac)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer-${{ steps.release-tag.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac*.yml

  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAIN_VITE_HYDRA_FIREBASE_API_KEY: ${{ vars.HYDRA_FIREBASE_API_KEY || secrets.HYDRA_FIREBASE_API_KEY }}
      MAIN_VITE_HYDRA_FIREBASE_AUTH_DOMAIN: ${{ vars.HYDRA_FIREBASE_AUTH_DOMAIN || secrets.HYDRA_FIREBASE_AUTH_DOMAIN }}
      MAIN_VITE_HYDRA_FIREBASE_PROJECT_ID: ${{ vars.HYDRA_FIREBASE_PROJECT_ID || secrets.HYDRA_FIREBASE_PROJECT_ID }}
      MAIN_VITE_HYDRA_FIREBASE_STORAGE_BUCKET: ${{ vars.HYDRA_FIREBASE_STORAGE_BUCKET || secrets.HYDRA_FIREBASE_STORAGE_BUCKET }}
      MAIN_VITE_HYDRA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.HYDRA_FIREBASE_MESSAGING_SENDER_ID || secrets.HYDRA_FIREBASE_MESSAGING_SENDER_ID }}
      MAIN_VITE_HYDRA_FIREBASE_APP_ID: ${{ vars.HYDRA_FIREBASE_APP_ID || secrets.HYDRA_FIREBASE_APP_ID }}
      MAIN_VITE_HYDRA_FIREBASE_MEASUREMENT_ID: ${{ vars.HYDRA_FIREBASE_MEASUREMENT_ID || secrets.HYDRA_FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV
          echo "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase release env
        shell: pwsh
        run: |
          $required = @(
            "MAIN_VITE_HYDRA_FIREBASE_API_KEY",
            "MAIN_VITE_HYDRA_FIREBASE_AUTH_DOMAIN",
            "MAIN_VITE_HYDRA_FIREBASE_PROJECT_ID",
            "MAIN_VITE_HYDRA_FIREBASE_STORAGE_BUCKET",
            "MAIN_VITE_HYDRA_FIREBASE_MESSAGING_SENDER_ID",
            "MAIN_VITE_HYDRA_FIREBASE_APP_ID"
          )
          $missing = @()
          foreach ($key in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -Path "env:$key" -ErrorAction SilentlyContinue).Value)) {
              $missing += $key
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Missing Firebase release env: $($missing -join ', ')"
            throw "Set repository vars/secrets HYDRA_FIREBASE_* before building a release."
          }

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Build Windows Installer Dry Run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:win:dry-run

      - name: Build Windows Installer
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run dist:win:dry-run

      - name: Resolve release tag (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        id: release-tag
        shell: pwsh
        run: |
          $tag = ""
          $tagFromSha = (git tag --points-at $env:GITHUB_SHA | Select-Object -First 1)
          if (-not [string]::IsNullOrWhiteSpace($tagFromSha)) {
            $tag = $tagFromSha.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($tag) -and $env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Substring(10).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Unable to resolve release tag. GITHUB_REF=$env:GITHUB_REF GITHUB_SHA=$env:GITHUB_SHA"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved release tag: $tag"

      - name: Enforce release version bump
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: npm run release:guard -- "${{ steps.release-tag.outputs.tag }}"

      - name: Ensure published release with generated notes (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: |
          $tag = "${{ steps.release-tag.outputs.tag }}"
          npm run release:notes -- upsert $tag --repo $env:GITHUB_REPOSITORY
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft,isPrerelease,url

      - name: Validate Windows updater metadata
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: npm run release:validate-win-artifacts

      - name: Upload release assets (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: |
          $tag = "${{ steps.release-tag.outputs.tag }}"
          gh release upload $tag `
            dist/*.exe `
            dist/*.blockmap `
            dist/latest*.yml `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

      - name: Upload workflow artifact (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.release-tag.outputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  linux-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAIN_VITE_HYDRA_FIREBASE_API_KEY: ${{ vars.HYDRA_FIREBASE_API_KEY || secrets.HYDRA_FIREBASE_API_KEY }}
      MAIN_VITE_HYDRA_FIREBASE_AUTH_DOMAIN: ${{ vars.HYDRA_FIREBASE_AUTH_DOMAIN || secrets.HYDRA_FIREBASE_AUTH_DOMAIN }}
      MAIN_VITE_HYDRA_FIREBASE_PROJECT_ID: ${{ vars.HYDRA_FIREBASE_PROJECT_ID || secrets.HYDRA_FIREBASE_PROJECT_ID }}
      MAIN_VITE_HYDRA_FIREBASE_STORAGE_BUCKET: ${{ vars.HYDRA_FIREBASE_STORAGE_BUCKET || secrets.HYDRA_FIREBASE_STORAGE_BUCKET }}
      MAIN_VITE_HYDRA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.HYDRA_FIREBASE_MESSAGING_SENDER_ID || secrets.HYDRA_FIREBASE_MESSAGING_SENDER_ID }}
      MAIN_VITE_HYDRA_FIREBASE_APP_ID: ${{ vars.HYDRA_FIREBASE_APP_ID || secrets.HYDRA_FIREBASE_APP_ID }}
      MAIN_VITE_HYDRA_FIREBASE_MEASUREMENT_ID: ${{ vars.HYDRA_FIREBASE_MEASUREMENT_ID || secrets.HYDRA_FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase release env
        shell: bash
        run: |
          missing=0
          for key in \
            MAIN_VITE_HYDRA_FIREBASE_API_KEY \
            MAIN_VITE_HYDRA_FIREBASE_AUTH_DOMAIN \
            MAIN_VITE_HYDRA_FIREBASE_PROJECT_ID \
            MAIN_VITE_HYDRA_FIREBASE_STORAGE_BUCKET \
            MAIN_VITE_HYDRA_FIREBASE_MESSAGING_SENDER_ID \
            MAIN_VITE_HYDRA_FIREBASE_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Set repository vars/secrets HYDRA_FIREBASE_* before building a release."
            exit 1
          fi

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Build Linux Artifacts (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:linux:dry-run

      - name: Build Linux Artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run dist:linux:dry-run

      - name: Resolve release tag (Linux)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        id: release-tag
        shell: bash
        run: |
          tag=""
          tag_from_sha=$(git tag --points-at "$GITHUB_SHA" | head -n1)
          if [ -n "$tag_from_sha" ]; then
            tag="$tag_from_sha"
          fi
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "Unable to resolve release tag. GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Ensure published release with generated notes (Linux)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: bash
        run: |
          tag="${{ steps.release-tag.outputs.tag }}"
          npm run release:notes -- upsert "$tag" --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json id,isDraft,isPrerelease,url

      - name: Upload release assets (Linux)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: bash
        run: |
          tag="${{ steps.release-tag.outputs.tag }}"
          shopt -s nullglob
          assets=(dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest-linux*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Linux artifacts found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload workflow artifact (Linux)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-${{ steps.release-tag.outputs.tag }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-linux*.yml
