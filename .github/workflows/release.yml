name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run signed/notarized build without publishing release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  mac-release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        id: mac-secrets
        shell: bash
        run: |
          missing=0
          for key in CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        run: npm ci

      - name: Validate
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Release Preflight
        if: ${{ steps.mac-secrets.outputs.available == 'true' }}
        run: npm run release:preflight

      - name: Build Signed Dry Run
        if: ${{ steps.mac-secrets.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:mac:dry-run

      - name: Build and Publish Release
        if: ${{ steps.mac-secrets.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: npm run dist:mac

      - name: Skip mac release
        if: ${{ steps.mac-secrets.outputs.available != 'true' }}
        run: echo "Skipping mac release because signing secrets are not configured."

  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV
          echo "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Build Windows Installer Dry Run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run dist:win:dry-run

      - name: Build Windows Installer
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run dist:win:dry-run

      - name: Resolve release tag (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        id: release-tag
        shell: pwsh
        run: |
          $tag = ""
          $tagFromSha = (git tag --points-at $env:GITHUB_SHA | Select-Object -First 1)
          if (-not [string]::IsNullOrWhiteSpace($tagFromSha)) {
            $tag = $tagFromSha.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($tag) -and $env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Substring(10).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Unable to resolve release tag. GITHUB_REF=$env:GITHUB_REF GITHUB_SHA=$env:GITHUB_SHA"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved release tag: $tag"

      - name: Enforce release version bump
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: npm run release:guard -- "${{ steps.release-tag.outputs.tag }}"

      - name: Ensure published release exists (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: |
          $tag = "${{ steps.release-tag.outputs.tag }}"
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft,isPrerelease,tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $tag `
              --notes "Automated Windows installer build."
            $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft,isPrerelease,tagName
          }

          $releaseData = $release | ConvertFrom-Json
          if ($releaseData.isPrerelease) {
            throw "Release $tag is marked prerelease. Stable updater channel requires published releases."
          }
          if ($releaseData.isDraft) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft,isPrerelease,url

      - name: Validate Windows updater metadata
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: npm run release:validate-win-artifacts

      - name: Upload release assets (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        run: |
          $tag = "${{ steps.release-tag.outputs.tag }}"
          gh release upload $tag `
            dist/*.exe `
            dist/*.blockmap `
            dist/latest*.yml `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

      - name: Upload workflow artifact (Windows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.release-tag.outputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
