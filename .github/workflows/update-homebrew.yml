name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.2.33)'
        required: true
        type: string

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "No tag resolved"; exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check token
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download DMG and compute SHA256
        if: steps.check.outputs.skip == 'false'
        id: dmg
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          url="https://github.com/jpdlr/hydra/releases/download/v${version}/hydra-${version}.dmg"
          echo "Fetching $url"
          curl -sfL -o hydra.dmg "$url"
          sha=$(shasum -a 256 hydra.dmg | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: jpdlr/homebrew-hydra
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite cask
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          mkdir -p tap/Casks
          version="${{ steps.meta.outputs.version }}"
          sha="${{ steps.dmg.outputs.sha }}"
          cp packaging/homebrew/hydra.rb tap/Casks/hydra.rb
          sed -i "s/^  version \".*\"/  version \"${version}\"/" tap/Casks/hydra.rb
          sed -i "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" tap/Casks/hydra.rb

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        shell: bash
        working-directory: tap
        run: |
          git config user.name "hydra-release-bot"
          git config user.email "hydra-release-bot@users.noreply.github.com"
          git add Casks/hydra.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "hydra ${{ steps.meta.outputs.version }}"
            git push
          fi
